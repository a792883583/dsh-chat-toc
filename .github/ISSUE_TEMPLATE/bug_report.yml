name: Bug 报告 (Bug report)
description: 提交可复现的 Bug。必须附截图证据，无截图将被关闭。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请保持本模板完整并填写所有必填部分。缺少截图证据的 Bug 报告将被自动关闭。

        提交前请先搜索确认没有重复：[搜索现有 Issue](https://github.com/a792883583/dsh-chat-toc/issues?q=is%3Aissue)
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 提交前查重
      description: 提交前请先搜索确认没有重复的 Issue。
      options:
        - label: 我已搜索过 open/closed 的 Issue，确认本 Issue 没有重复。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      description: 选择问题涉及的插件区域。
      options:
        - 目录窄条
        - 弹出列表
        - 跳转定位
        - 当前阅读高亮
        - 多语言 (i18n)
        - 安装 / 构建
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue 类型
      description: 本表单仅用于可复现的 Bug；功能请求请使用另一个表单。
      options:
        - Bug 报告
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用一两句话描述 Bug。
      placeholder: 出了什么问题？
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: 预期结果
      description: 描述应该发生什么。
      placeholder: 你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: details-reproduction
    attributes:
      label: 详情 / 复现步骤
      description: 给出清晰的复现步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: DSH 版本、浏览器、插件名称与版本、操作系统及关键配置。
      placeholder: |
        - DSH 版本:
        - 浏览器:
        - 插件名称 / 版本:
        - 操作系统:
    validations:
      required: true
  - type: textarea
    id: bug-screenshot
    attributes:
      label: Bug 截图
      description: 粘贴或上传展示 Bug 的截图。无截图证据的 Bug 报告将被自动关闭。
      placeholder: 将图片拖到此处，或粘贴 GitHub 图片 / 文件链接。
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 如有日志、链接或其他上下文，请补充。
    validations:
      required: false
